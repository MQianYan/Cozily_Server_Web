<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公告| CozilyMC</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@500;700;800&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">
    
    <style>
        :root {
            --primary-purple: #b19cd9;
            --surface: #0a0a0c;
            --nav-bg: rgba(255, 255, 255, 0.08);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-sub: rgba(255, 255, 255, 0.6);
            --transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            --blob-color-1: #1a237e;
            --blob-color-2: #4a148c;
        }

        [data-theme="light"] {
            --surface: #f0f2f5;
            --nav-bg: rgba(255, 255, 255, 0.4);
            --glass-bg: rgba(255, 255, 255, 0.5);
            --glass-border: rgba(255, 255, 255, 0.5);
            --text-main: #1d1d1f;
            --text-sub: #6e6e73;
            --blob-color-1: #d1d8ff;
            --blob-color-2: #ffdee9;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Google Sans', 'Noto Sans SC', sans-serif; }

        body {
            background-color: var(--surface);
            color: var(--text-main);
            overflow-x: hidden;
            transition: var(--transition);
            min-height: 100vh;
        }

        /* --- 背景光晕 --- */
        .blobs { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; filter: blur(80px); opacity: 0.6; }
        .blob { position: absolute; width: 600px; height: 600px; border-radius: 50%; animation: move 20s infinite alternate; }
        .blob-1 { background: var(--blob-color-1); top: -150px; right: -150px; }
        .blob-2 { background: var(--blob-color-2); bottom: -150px; left: -150px; animation-delay: -5s; }
        @keyframes move { from { transform: translate(0, 0) scale(1); } to { transform: translate(-100px, 100px) scale(1.2); } }

        /* --- 导航栏 --- */
        .header-container { position: fixed; top: 20px; left: 0; width: 100%; display: flex; justify-content: center; z-index: 1000; padding: 0 15px; }
        .glass-nav {
            width: 100%; max-width: 900px; height: 64px;
            display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
            padding: 0 10px 0 24px; background: var(--nav-bg);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 100px;
        }
        .nav-center { display: flex; gap: 4px; }
        .nav-right { display: flex; justify-content: flex-end; align-items: center; }
        .nav-btn {
            padding: 0 18px; border-radius: 100px; text-decoration: none; color: var(--text-main); font-size: 0.95rem;
            transition: var(--transition); display: flex; align-items: center; height: 44px;
        }
        .nav-btn:hover, .nav-btn.active { background: rgba(177, 156, 217, 0.15); color: var(--primary-purple); }
        .theme-toggle {
            background: var(--glass-bg); border: 1px solid var(--glass-border); cursor: pointer;
            width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            color: var(--text-main); transition: var(--transition);
        }

        /* --- 筛选面板 --- */
        .filter-section { max-width: 900px; margin: 140px auto 40px; padding: 0 24px; }
        .filter-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 32px;
            padding: 24px; backdrop-filter: blur(10px);
            display: flex; flex-direction: column; gap: 20px;
        }
        .search-row { display: flex; gap: 12px; flex-wrap: wrap; }
        .input-wrapper { position: relative; flex: 1; min-width: 200px; }
        .input-wrapper i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-sub); }
        .filter-input {
            width: 100%; height: 48px; border-radius: 16px; background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border); color: var(--text-main); padding: 0 16px 0 45px;
            outline: none; transition: var(--transition);
        }
        .filter-input:focus { border-color: var(--primary-purple); background: rgba(255,255,255,0.1); }
        
        .date-input { width: 180px; padding-left: 15px !important; }

        .category-row { display: flex; gap: 10px; flex-wrap: wrap; }
        .cat-btn {
            padding: 8px 18px; border-radius: 12px; background: var(--glass-bg); 
            border: 1px solid var(--glass-border); color: var(--text-sub); cursor: pointer;
            font-size: 0.9rem; transition: var(--transition);
        }
        .cat-btn:hover, .cat-btn.active { background: var(--primary-purple); color: #000; font-weight: 700; }

        /* --- 公告列表 --- */
        .notice-container { max-width: 900px; margin: 0 auto 100px; padding: 0 24px; }
        .notice-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 28px;
            padding: 30px; margin-bottom: 20px; transition: var(--transition);
            backdrop-filter: blur(10px); position: relative; overflow: hidden;
        }
        .notice-card:hover { transform: translateY(-5px); border-color: var(--primary-purple); }
        .notice-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .notice-tag { font-size: 0.7rem; font-weight: 800; padding: 4px 12px; border-radius: 100px; background: rgba(177, 156, 217, 0.2); color: var(--primary-purple); text-transform: uppercase; }
        .notice-time { font-size: 0.85rem; color: var(--text-sub); }
        .notice-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 12px; line-height: 1.3; }
        .notice-content { color: var(--text-sub); font-size: 0.95rem; line-height: 1.7; }

        #empty-msg { text-align: center; padding: 60px; color: var(--text-sub); display: none; }

        @media (max-width: 768px) {
            .glass-nav { grid-template-columns: auto 1fr auto; }
            .nav-left { display: none; }
            .date-input { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <header class="header-container">
        <nav class="glass-nav">
            <div class="nav-left"><div class="logo" style="font-weight: 800; color: var(--primary-purple);">✦ CozilyMC</div></div>
            <div class="nav-center">
                <a href="index.html" class="nav-btn">首页</a>
                <a href="zonghe.html" class="nav-btn active">综合</a>
                <a href="Group.html" class="nav-btn">团队</a>
                <a href="faq.html" class="nav-btn">FAQ</a>
            </div>
            <div class="nav-right">
                <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">
                    <i class="mdi mdi-weather-night" id="themeIcon"></i>
                </button>
            </div>
        </nav>
    </header>

    <div class="filter-section">
        <h1 style="font-size: 3rem; font-weight: 800; margin-bottom: 30px; letter-spacing: -1.5px;">公告中心</h1>
        <div class="filter-card">
            <div class="search-row">
                <div class="input-wrapper">
                    <i class="mdi mdi-magnify"></i>
                    <input type="text" id="keywordSearch" class="filter-input" placeholder="检索公告内容...">
                </div>
                <div class="input-wrapper">
                    <i class="mdi mdi-calendar-range" style="z-index: 1;"></i>
                    <input type="date" id="dateFilter" class="filter-input date-input">
                </div>
            </div>
            <div class="category-row">
                <button class="cat-btn active" data-type="all">全部</button>
                <button class="cat-btn" data-type="更新">更新</button>
                <button class="cat-btn" data-type="活动">活动</button>
                <button class="cat-btn" data-type="维护">维护</button>
            </div>
        </div>
    </div>

    <main class="notice-container" id="noticeList">
        <div class="notice-card" data-type="更新" data-date="2026-04-15">
            <div class="notice-meta">
                <span class="notice-tag">更新</span>
                <span class="notice-time">2026年4月15日</span>
            </div>
            <h2 class="notice-title">V2 官网视觉重构正式上线</h2>
            <p class="notice-content">为了提升玩家的浏览体验，我们全面重构了官网前端。引入了全新的玻璃拟态交互风格，优化了移动端适配，并新增了实时状态面板。</p>
        </div>

        <div class="notice-card" data-type="维护" data-date="2026-04-10">
            <div class="notice-meta">
                <span class="notice-tag">维护</span>
                <span class="notice-time">2026年4月10日</span>
            </div>
            <h2 class="notice-title">主城存储区扩容维护公告</h2>
            <p class="notice-content">我们将于凌晨 2:00 进行例行维护，针对生电存储设施进行逻辑优化，预计维护时间 1 小时。</p>
        </div>

        <div class="notice-card" data-type="活动" data-date="2026-02-20">
            <div class="notice-meta">
                <span class="notice-tag">活动</span>
                <span class="notice-time">2026年2月20日</span>
            </div>
            <h2 class="notice-title">新春红石设计大赛</h2>
            <p class="notice-content">展示你的生电才华！本次大赛旨在评选出最优雅的红石机械结构，获奖者将获得限定服务器称号。</p>
        </div>

        <div id="empty-msg">没有找到匹配的公告</div>
    </main>

    <script>
        // 主题切换
        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('themeIcon');
            if (html.getAttribute('data-theme') === 'light') {
                html.removeAttribute('data-theme');
                icon.className = 'mdi mdi-weather-night';
                localStorage.setItem('theme', 'dark');
            } else {
                html.setAttribute('data-theme', 'light');
                icon.className = 'mdi mdi-white-balance-sunny';
                localStorage.setItem('theme', 'light');
            }
        }

        // 检索逻辑
        const keywordInput = document.getElementById('keywordSearch');
        const dateInput = document.getElementById('dateFilter');
        const catBtns = document.querySelectorAll('.cat-btn');
        const noticeCards = document.querySelectorAll('.notice-card');
        const emptyMsg = document.getElementById('empty-msg');

        function performFilter() {
            const keyword = keywordInput.value.toLowerCase();
            const date = dateInput.value;
            const activeCat = document.querySelector('.cat-btn.active').getAttribute('data-type');
            
            let visibleCount = 0;

            noticeCards.forEach(card => {
                const title = card.querySelector('.notice-title').innerText.toLowerCase();
                const content = card.querySelector('.notice-content').innerText.toLowerCase();
                const type = card.getAttribute('data-type');
                const cardDate = card.getAttribute('data-date');

                const matchesKeyword = title.includes(keyword) || content.includes(keyword);
                const matchesCat = (activeCat === 'all' || type === activeCat);
                const matchesDate = (date === '' || cardDate === date);

                if (matchesKeyword && matchesCat && matchesDate) {
                    card.style.display = 'block';
                    visibleCount++;
                } else {
                    card.style.display = 'none';
                }
            });

            emptyMsg.style.display = visibleCount === 0 ? 'block' : 'none';
        }

        keywordInput.oninput = performFilter;
        dateInput.onchange = performFilter;

        catBtns.forEach(btn => {
            btn.onclick = () => {
                catBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                performFilter();
            };
        });

        window.onload = () => {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
                document.getElementById('themeIcon').className = 'mdi mdi-white-balance-sunny';
            }
        };
    </script>
</body>
</html>
