<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面走丢了 | CozilyMC</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@500;700;800&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">
    
    <style>
        /* --- 完全复用 index 核心变量 --- */
        :root {
            --primary-purple: #b19cd9;
            --surface: #0a0a0c;
            --nav-bg: rgba(255, 255, 255, 0.08);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-sub: rgba(255, 255, 255, 0.6);
            --transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            --blob-color-1: #1a237e;
            --blob-color-2: #4a148c;
        }

        [data-theme="light"] {
            --surface: #f0f2f5;
            --nav-bg: rgba(255, 255, 255, 0.4);
            --glass-bg: rgba(255, 255, 255, 0.5);
            --glass-border: rgba(255, 255, 255, 0.5);
            --text-main: #1d1d1f;
            --text-sub: #6e6e73;
            --blob-color-1: #d1d8ff;
            --blob-color-2: #ffdee9;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Google Sans', 'Noto Sans SC', sans-serif; }

        body {
            background-color: var(--surface);
            color: var(--text-main);
            overflow: hidden;
            transition: var(--transition);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- 动态光晕背景 (完全复用) --- */
        .blobs { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: -1; filter: blur(80px); opacity: 0.6;
            transition: var(--transition);
        }
        .blob { position: absolute; width: 600px; height: 600px; border-radius: 50%; animation: move 20s infinite alternate; transition: var(--transition); }
        .blob-1 { background: var(--blob-color-1); top: -150px; right: -150px; }
        .blob-2 { background: var(--blob-color-2); bottom: -150px; left: -150px; animation-delay: -5s; }
        @keyframes move { from { transform: translate(0, 0) scale(1); } to { transform: translate(-100px, 100px) scale(1.2); } }

        /* --- 导航栏：模式切换靠右, FAQ 垂直居中 (完全复用 index 结构) --- */
        .header-container {
            position: fixed; top: 20px; left: 0; width: 100%;
            display: flex; justify-content: center; z-index: 1000; padding: 0 15px;
        }

        .glass-nav {
            width: 100%; max-width: 900px; height: 64px;
            display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
            padding: 0 10px 0 24px;
            background: var(--nav-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 100px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            transition: var(--transition);
        }

        .nav-left { display: flex; align-items: center; }
        .nav-center { display: flex; gap: 4px; align-items: center; justify-content: center; }
        .nav-right { display: flex; align-items: center; justify-content: flex-end; }
        .logo { font-size: 1.1rem; font-weight: 800; color: var(--primary-purple); letter-spacing: -0.5px; }

        .nav-btn {
            padding: 0 18px; border-radius: 100px;
            text-decoration: none; color: var(--text-main); font-size: 0.95rem; font-weight: 500;
            transition: var(--transition);
            display: flex; align-items: center; height: 44px; line-height: 44px;
        }
        .nav-btn:hover { color: var(--primary-purple); background: rgba(177, 156, 217, 0.1); }

        .theme-toggle {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            cursor: pointer; width: 44px; height: 44px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: var(--text-main); font-size: 1.2rem; transition: var(--transition);
        }

        /* --- 404 内容：左对齐于导航栏垂线 --- */
        .error-main {
            flex: 1;
            width: 100%;
            max-width: 900px; /* 对齐导航栏宽度 */
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 24px; /* 对齐导航栏内边距 */
        }

        .error-code {
            font-size: clamp(8rem, 20vw, 12rem);
            font-weight: 800;
            line-height: 0.9;
            margin-left: -10px; /* 视觉补偿，使数字左侧完全贴合垂线 */
            background: linear-gradient(180deg, var(--primary-purple) 0%, rgba(177, 156, 217, 0.2) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 30px rgba(177, 156, 217, 0.2));
            transition: var(--transition);
        }

        .error-msg {
            font-size: 1.5rem;
            color: var(--text-main);
            margin: 20px 0 40px;
            max-width: 600px;
            line-height: 1.6;
            transition: var(--transition);
        }

        .btn-group { display: flex; gap: 20px; }
        .btn {
            padding: 16px 32px; border-radius: 100px; text-decoration: none;
            font-weight: 700; transition: var(--transition);
            display: flex; align-items: center; gap: 10px;
        }
        .btn-primary { background: var(--primary-purple); color: #fff; box-shadow: 0 10px 30px rgba(177, 156, 217, 0.3); }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 15px 40px rgba(177, 156, 217, 0.5); }
        .btn-secondary { background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--text-main); }

        /* --- 页脚同步 --- */
        footer {
            background: rgba(0,0,0,0.1); border-top: 1px solid var(--glass-border);
            padding: 40px 20px; text-align: center; transition: var(--transition);
        }
        .footer-content p { color: var(--text-sub); font-size: 0.8rem; line-height: 1.8; }

        @media (max-width: 768px) {
            .glass-nav { grid-template-columns: auto 1fr auto; padding: 0 10px; }
            .nav-btn { padding: 0 10px; font-size: 0.85rem; }
            .error-main { padding: 0 20px; }
            .error-code { font-size: 6rem; }
            .btn-group { flex-direction: column; width: fit-content; }
        }
    </style>
</head>
<body>

    <div class="blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <header class="header-container">
        <nav class="glass-nav">
            <div class="nav-left"><div class="logo">✦ CozilyMC</div></div>
            <div class="nav-center">
                <a href="index.html" class="nav-btn">首页</a>
                <a href="zonghe.html" class="nav-btn">综合</a>
                <a href="Group.html" class="nav-btn">团队</a>
                <a href="faq.html" class="nav-btn">FAQ</a>
            </div>
            <div class="nav-right">
                <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">
                    <i class="mdi mdi-weather-night" id="themeIcon"></i>
                </button>
            </div>
        </nav>
    </header>

    <main class="error-main">
        <div class="error-code">404</div>
        <p class="error-msg">
            这里什么都没有，<br>
            看来末影人把你要找的页面搬走了。
        </p>
        <div class="btn-group">
            <a href="index.html" class="btn btn-primary">
                <i class="mdi mdi-home"></i> 返回首页
            </a>
            <a href="javascript:history.back()" class="btn btn-secondary">
                <i class="mdi mdi-undo-variant"></i> 回到上一页
            </a>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <p>© 2026 www.cozily.top | QQ 交流群: 749543572</p>
            <p>CozilyMC 是一个独立的玩家社区。Minecraft™ 是 Mojang Studios 和 Microsoft Corporation 的商标。</p>
            <p>本站及服务器未获 Mojang Studios 或 Microsoft 批准，亦不与其关联。我们致力于为玩家提供健康的竞技环境与正确的价值观。</p>
        </div>
    </footer>

    <script>
        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('themeIcon');
            if (html.getAttribute('data-theme') === 'light') {
                html.removeAttribute('data-theme');
                icon.className = 'mdi mdi-weather-night';
                localStorage.setItem('theme', 'dark');
            } else {
                html.setAttribute('data-theme', 'light');
                icon.className = 'mdi mdi-white-balance-sunny';
                localStorage.setItem('theme', 'light');
            }
        }

        window.onload = () => {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
                document.getElementById('themeIcon').className = 'mdi mdi-white-balance-sunny';
            }
        };
    </script>
</body>
</html>
